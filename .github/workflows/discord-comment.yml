name: Discord Comment Notification

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Comment Embed to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_JSON: ${{ toJson(github.event) }}
        run: |
          # Parse event data safely using jq to avoid linter context warnings
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          REPO_URL="${{ github.event.repository.html_url }}"
          
          if [ "$EVENT_NAME" == "pull_request_review" ]; then
            PR_NUM=$(echo "$PAYLOAD_JSON" | jq -r '.pull_request.number')
            PR_TITLE=$(echo "$PAYLOAD_JSON" | jq -r '.pull_request.title')
            COMMENT_URL=$(echo "$PAYLOAD_JSON" | jq -r '.review.html_url')
            COMMENT_BODY=$(echo "$PAYLOAD_JSON" | jq -r '.review.body // "*(Submitted a review without text)*"')
            TITLE="⭐ New PR review on #$PR_NUM `$PR_TITLE`"
          elif [ "$EVENT_NAME" == "pull_request_review_comment" ]; then
            PR_NUM=$(echo "$PAYLOAD_JSON" | jq -r '.pull_request.number')
            COMMENT_URL=$(echo "$PAYLOAD_JSON" | jq -r '.comment.html_url')
            COMMENT_BODY=$(echo "$PAYLOAD_JSON" | jq -r '.comment.body')
            TITLE="💬 New code review comment on #$PR_NUM"
          else
            PR_NUM=$(echo "$PAYLOAD_JSON" | jq -r '.issue.number')
            PR_TITLE=$(echo "$PAYLOAD_JSON" | jq -r '.issue.title')
            COMMENT_URL=$(echo "$PAYLOAD_JSON" | jq -r '.comment.html_url')
            COMMENT_BODY=$(echo "$PAYLOAD_JSON" | jq -r '.comment.body')
            TITLE="💬 New comment on #$PR_NUM `$PR_TITLE`"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$COMMENT_URL" \
            --arg desc "$COMMENT_BODY" \
            --arg author "$ACTOR" \
            --arg repo "$REPO" \
            --arg repo_url "$REPO_URL" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3447003,
                fields: [
                  {name: "Author", value: $author, inline: true},
                  {name: "Repository", value: "[\($repo)](\($repo_url))", inline: true}
                ]
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"